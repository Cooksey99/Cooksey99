name: Metrics
on:
  schedule: [{cron: "0 * * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Cooksey99
          template: classic
          base: header, isocalendar, languages, notable, sponsorships
          
          # Core settings (apply globally)
          repositories_affiliations: owner, collaborator, organization_member
          config_timezone: America/Chicago
          config_octicon: yes
          
          # Languages (org-aware)
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage, lines
          plugin_languages_sections: recently-used, most-used
          plugin_languages_indepth: yes
          plugin_languages_recent_days: 365
          plugin_languages_recent_load: 3000
          plugin_languages_aliases: "TSX:TypeScript, JSX:JavaScript"
          plugin_languages_ignored: html, css, scss, shell, makefile, dockerfile, markdown
          plugin_languages_threshold: 0.5%
          commits_authoring: >
            Cooksey99, andrewcooksey42@gmail.com, acooksey@actota.com, acooksey@beconsocial.com
          plugin_languages_indepth_custom: Cooksey99/text-motions@macos
          
          # Followup (org-aware) 
          plugin_followup: yes
          plugin_followup_indepth: yes
          plugin_followup_sections: user, repositories
          
          # Others
          plugin_notable: yes
          plugin_notable_from: all
          plugin_notable_types: commit, pull_request, issue
          plugin_sponsorships: yes
          plugin_sponsorships_sections: sponsorships
          plugin_sponsorships_size: 24

          # Control rendering order to avoid conflicts
          config_order: header, isocalendar, languages, followup, notable, sponsorships
