# Visit https://github.com/lowlighter/metrics#-documentation for full reference
name: Metrics
on:
  # Schedule updates (each hour)
  schedule: [{cron: "0 * * * *"}]
  # Lines below let you run workflow manually and on each commit
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Your GitHub token
          # The following scopes are required:
           # - public_access (default scope)
          #  - read:user
          #  - read:org
          # The following additional scopes may be required:
          #  - read:org      (for organization related metrics)
          #  - read:user     (for user related data)
          #  - read:packages (for some packages related data)
          #  - repo          (optional, if you want to include private repositories)
          token: ${{ secrets.METRICS_TOKEN }}

          # Options
          user: Cooksey99
          template: classic
          base: header, activity, community, repositories, metadata
          config_octicon: yes
          config_timezone: America/Chicago
          # plugin_16personalities: yes
          # plugin_16personalities_scores: yes
          # plugin_16personalities_sections: personality
          # plugin_16personalities_url: https://www.16personalities.com/profiles/39574ce28d6ee
          plugin_followup: yes
          plugin_followup_archived: yes
          plugin_followup_indepth: yes
          plugin_followup_sections: user, repositories
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages_indepth: yes
          plugin_languages_aliases: TSX:TypeScript, JSX:JavaScript
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_timeout_repositories: 7.5
          plugin_languages_colors: github
          plugin_languages_ignored: html, css, scss, shell, d, makefile, dockerfile, markdown, cmake, renderscript
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size, percentage
          plugin_languages_recent_days: 365
          plugin_languages_recent_load: 2000
          plugin_languages_sections: most-used
          plugin_languages_threshold: 2%
          plugin_notable: yes
          plugin_notable_from: organization
          plugin_notable_self: yes
          plugin_notable_types: commit
          plugin_sponsorships: yes
          plugin_sponsorships_sections: sponsorships
          plugin_sponsorships_size: 24
