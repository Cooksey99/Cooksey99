name: Metrics
on:
  schedule: [{cron: "0 1 * * *"}]
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # important: full history

      # Header & Community Stats
      - uses: lowlighter/metrics@latest
        with:
          filename: header.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: header, community, metadata
          config_timezone: UTC

      # Detailed Language Analysis (Past Year)
      - uses: lowlighter/metrics@latest
        with:
          filename: languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage, lines
          plugin_languages_sections: recently-used, most-used
          plugin_languages_indepth: yes
          plugin_languages_recent_days: 365
          plugin_languages_recent_load: 3000
          plugin_languages_aliases: "TSX:TypeScript, JSX:JavaScript"
          plugin_languages_ignored: html, css, scss, shell, d, makefile, dockerfile, markdown, cmake, renderscript
          plugin_languages_threshold: 2%
          commits_authoring: >
            Cooksey99,
            andrewcooksey42@gmail.com,
            acooksey@actota.com,
            acooksey@beconsocial.com

      # Open Source & Notable Contributions
      - uses: lowlighter/metrics@latest
        with:
          filename: open-source.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_notable: yes
          plugin_notable_from: all
          plugin_notable_types: commit, pull_request
          plugin_followup: yes
          plugin_followup_sections: user

      # Isometric Calendar
      - uses: lowlighter/metrics@latest
        with:
          filename: isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # Indepth Analysis
      - uses: lowlighter/metrics@latest
        with:
          filename: indepth-analysis.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_followup: yes
          plugin_followup_indepth: yes
