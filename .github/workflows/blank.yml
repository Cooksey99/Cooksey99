- uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Cooksey99
          template: classic
          # Added 'notable' and 'followup' to the base/plugins for OS contributions
          base: header, community, repositories, metadata
          config_timezone: UTC
          
          # 1. ACCURATE LANGUAGES (Private + Public)
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_details: bytes-size, percentage, lines # 'lines' requires indepth
          plugin_languages_indepth: yes    # Scans commits for actual work done
          plugin_languages_limit: 8
          
          # 2. OPEN SOURCE HIGHLIGHTS
          # This shows logos of big projects/orgs you've contributed to
          plugin_notable: yes
          plugin_notable_from: all         # Include both user and organization repos
          plugin_notable_types: commit, pull_request
          
          # 3. FOLLOWUP (Shows status of your PRs and Issues)
          plugin_followup: yes
          plugin_followup_sections: user   # Shows your OS contribution progress
          
          # 4. REPOSITORY STATS (Ensures private data is fetched)
          repositories_batch: 200
